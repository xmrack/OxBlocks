[package]
name = "explorer-core"
description = "Domain model, chain access abstraction and decoding for oxblocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
monerod-rpc = { path = "../monerod-rpc", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# The curves of the FCMP++ curve tree, and the Ed25519 arithmetic that turns
# an output into a leaf, to recompute a path up to its root. The revision
# monerod's stressnet v3 branch builds with (its
# `src/fcmp_pp/fcmp_pp_rust/Cargo.toml`).
helioselene = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93" }
ec-divisors = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93", features = ["ed25519"] }
monero-ed25519 = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93" }
monero-primitives = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93" }
dalek-ff-group = "0.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
multiexp = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
