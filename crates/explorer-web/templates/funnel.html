{# The curve tree `t`, a `TreeFunnel`, drawn. #}
    <svg class="funnel" viewBox="0 0 {{ crate::html::STRIP_WIDTH }} {{ t.height }}"
         role="img" aria-label="Curve tree of {{ t.leaves }} outputs in {{ t.layers }} layer{% if t.layers != 1 %}s{% endif %}, the root at the top">
      {% for w in t.webs %}<polygon class="web" points="{{ w }}"/>{% endfor %}
      {% for r in t.rows %}<rect class="bar {{ r.class }}" x="{{ r.x }}" y="{{ r.y }}" rx="3" width="{{ r.width }}" height="{{ crate::html::FUNNEL_BAR }}"/>{% for c in r.cuts %}<line class="cut" x1="{{ c }}" y1="{{ r.y }}" x2="{{ c }}" y2="{{ r.y + crate::html::FUNNEL_BAR }}"/>{% endfor %}
      <text class="label" x="0" y="{{ r.y + 12 }}">{{ r.name }}{% if let Some(curve) = r.curve %}<tspan class="curve"> · {{ curve }}</tspan>{% endif %}</text>
      <text class="count" x="{{ crate::html::STRIP_WIDTH }}" y="{{ r.y + 12 }}" text-anchor="end">{{ r.count }}</text>
      {% endfor %}
      {% if let Some(root) = t.root %}<text class="root-hash" x="{{ crate::html::FUNNEL_CENTRE }}" y="{{ crate::html::FUNNEL_TOP - 3 }}" text-anchor="middle">{{ root }}</text>{% endif %}
    </svg>
